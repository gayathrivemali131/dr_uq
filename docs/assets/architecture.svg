<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f4c5c"/></marker></defs><rect x="10" y="10" width="740" height="52" rx="5" fill="#fdf1e7" stroke="#e36414" stroke-width="1.3"/><text x="18" y="27" font-size="11" font-weight="700" fill="#e36414">Cross-cutting: Hydra configuration &amp; reproducibility</text><text x="18" y="43" font-size="8.6" fill="#1d2a2e">configs/{data,model,uq,train,deploy,experiment}  ·  seeds (Python/NumPy/torch/CUDA, per-epoch workers)  ·  run_dir ← resolved config + git hash + pip freeze  ·  W&amp;B (optional, offline)</text><text x="18" y="55" font-size="8.6" fill="#1d2a2e">scripts/train.py · evaluate.py · sweep.py · explain.py · train_generator.py     tests/ (unit + integration)     CI: ruff · black · mypy · pytest · config-composition check</text><rect x="10" y="80" width="235" height="110" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="18" y="97" font-size="11" font-weight="700" fill="#0f4c5c">1  Data layer  (dr_uq.data)</text><text x="18" y="113" font-size="8.6" fill="#1d2a2e">Loaders: APTOS 2019, EyePACS 2015,</text><text x="18" y="125" font-size="8.6" fill="#1d2a2e">Messidor-2, IDRiD (+MA/HE/EX/SE masks), synthetic</text><text x="18" y="137" font-size="8.6" fill="#1d2a2e">Patient-level 70/15/15 split → CSV manifests (DVC)</text><text x="18" y="149" font-size="8.6" fill="#1d2a2e">FOV crop → Graham norm. → 512² → quality q(x)</text><text x="18" y="161" font-size="8.6" fill="#1d2a2e">Albumentations · class-balanced sampler</text><text x="18" y="173" font-size="8.6" fill="#1d2a2e">Lightning FundusDataModule</text><rect x="262" y="80" width="235" height="110" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="270" y="97" font-size="11" font-weight="700" fill="#0f4c5c">2  Model layer  (dr_uq.models)</text><text x="270" y="113" font-size="8.6" fill="#1d2a2e">timm backbones: ResNet-50 · EfficientNet-B4</text><text x="270" y="125" font-size="8.6" fill="#1d2a2e">ViT-B/16 (grad-ckpt) · Swin-T</text><text x="270" y="137" font-size="8.6" fill="#1d2a2e">GradingModel = backbone → dropout(p) → Linear(5)</text><text x="270" y="149" font-size="8.6" fill="#1d2a2e">dropout_active flag for MC sampling</text><text x="270" y="161" font-size="8.6" fill="#1d2a2e">LitGrader: AdamW, warm-up + cosine, label</text><text x="270" y="173" font-size="8.6" fill="#1d2a2e">smoothing, early stop on val QWK</text><rect x="514" y="80" width="236" height="110" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="522" y="97" font-size="11" font-weight="700" fill="#0f4c5c">3  Uncertainty layer  (dr_uq.uncertainty)</text><text x="522" y="113" font-size="8.6" fill="#1d2a2e">UQWrapper protocol: fit(val) · predict(x) → (p, u)</text><text x="522" y="125" font-size="8.6" fill="#1d2a2e">none · temperature scaling (LBFGS on NLL)</text><text x="522" y="137" font-size="8.6" fill="#1d2a2e">MC dropout (T=20) · deep ensemble (M=5)</text><text x="522" y="149" font-size="8.6" fill="#1d2a2e">scores: 1−max p · entropy · mutual information</text><text x="522" y="161" font-size="8.6" fill="#1d2a2e">calibration: ECE/MCE/NLL/Brier, reliability</text><rect x="514" y="225" width="236" height="110" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="522" y="242" font-size="11" font-weight="700" fill="#0f4c5c">4  Decision layer  (dr_uq.selective)</text><text x="522" y="258" font-size="8.6" fill="#1d2a2e">SelectiveGate(τ, score): grade 0–4 or REFER (−1)</text><text x="522" y="270" font-size="8.6" fill="#1d2a2e">risk–coverage sweep (200 τ) · exact AURC</text><text x="522" y="282" font-size="8.6" fill="#1d2a2e">excess AURC · sel. error @80/90 % coverage</text><text x="522" y="294" font-size="8.6" fill="#1d2a2e">referral-budget table (5–50 % referred)</text><text x="522" y="306" font-size="8.6" fill="#1d2a2e">stratified abstentions: quality bin × grade</text><rect x="262" y="225" width="235" height="110" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="270" y="242" font-size="11" font-weight="700" fill="#0f4c5c">5  Explanation layer  (dr_uq.counterfactual)</text><text x="270" y="258" font-size="8.6" fill="#1d2a2e">Generator: StyleGAN2-ADA | placeholder</text><text x="270" y="270" font-size="8.6" fill="#1d2a2e">invert: w* = argmin L2 + λ·LPIPS</text><text x="270" y="282" font-size="8.6" fill="#1d2a2e">optimise: CE(f(G(w))/T, g′) + λ₁‖G(w)−x‖₁</text><text x="270" y="294" font-size="8.6" fill="#1d2a2e">         + λ₂·LPIPS,  g′ ∈ {g−1, g+1}</text><text x="270" y="306" font-size="8.6" fill="#1d2a2e">validate: flip rate · lesion IoU vs random</text><text x="270" y="318" font-size="8.6" fill="#1d2a2e">baseline · FID · Likert · Grad-CAM baseline</text><rect x="10" y="225" width="235" height="110" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="18" y="242" font-size="11" font-weight="700" fill="#0f4c5c">6  Serving layer  (dr_uq.deploy)</text><text x="18" y="258" font-size="8.6" fill="#1d2a2e">ONNX export: backbone + T in one graph</text><text x="18" y="270" font-size="8.6" fill="#1d2a2e">(ORT parity check ≤ 1e-3)</text><text x="18" y="282" font-size="8.6" fill="#1d2a2e">TensorRT FP16 / INT8 (entropy calibration)</text><text x="18" y="294" font-size="8.6" fill="#1d2a2e">profile: latency &amp; memory per back-end</text><text x="18" y="306" font-size="8.6" fill="#1d2a2e">dr-uq grade CLI → {grade, confidence,</text><text x="18" y="318" font-size="8.6" fill="#1d2a2e">uncertainty, refer, latency_ms} · Dockerfile</text><rect x="10" y="370" width="740" height="88" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="18" y="387" font-size="11" font-weight="700" fill="#0f4c5c">Evaluation &amp; reporting  (dr_uq.evaluation)</text><text x="18" y="403" font-size="8.6" fill="#1d2a2e">evaluate.py → report.json · predictions.npz · reliability.png · risk_coverage.{csv,png} · referral_budget.csv · stratification.csv · model_card.md · model.onnx</text><text x="18" y="415" font-size="8.6" fill="#1d2a2e">report.py → paper tables (data × backbone × UQ, mean over seeds, 95 % bootstrap CIs over 1 000 image resamples) as Markdown + CSV</text><text x="18" y="427" font-size="8.6" fill="#1d2a2e">External-shift protocol: APTOS-trained → Messidor-2 (eval.external=true, eval.fit_data=aptos: T and τ fitted on APTOS validation only)</text><line x1="245" y1="135" x2="262" y2="135" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><text x="253.5" y="131.0" font-size="8" fill="#5b6b70" text-anchor="middle">batches</text><line x1="497" y1="135" x2="514" y2="135" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><text x="505.5" y="131.0" font-size="8" fill="#5b6b70" text-anchor="middle">logits</text><line x1="632" y1="190" x2="632" y2="225" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><text x="632.0" y="203.5" font-size="8" fill="#5b6b70" text-anchor="middle">(p, u)</text><line x1="514" y1="280" x2="497" y2="280" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><text x="505.5" y="276.0" font-size="8" fill="#5b6b70" text-anchor="middle">u(x)</text><line x1="380" y1="190" x2="380" y2="225" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><text x="380.0" y="203.5" font-size="8" fill="#5b6b70" text-anchor="middle">frozen f, T</text><line x1="127" y1="190" x2="127" y2="225" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><text x="127.0" y="203.5" font-size="8" fill="#5b6b70" text-anchor="middle">val batches (INT8 calib.)</text><line x1="632" y1="335" x2="632" y2="370" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><text x="632.0" y="348.5" font-size="8" fill="#5b6b70" text-anchor="middle">decisions</text><line x1="380" y1="335" x2="380" y2="370" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><text x="380.0" y="348.5" font-size="8" fill="#5b6b70" text-anchor="middle">explanations</text><line x1="127" y1="335" x2="127" y2="370" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><text x="127.0" y="348.5" font-size="8" fill="#5b6b70" text-anchor="middle">profiles · ONNX</text><line x1="380" y1="62" x2="380" y2="80" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><text x="380.0" y="67.0" font-size="8" fill="#5b6b70" text-anchor="middle">config</text></svg>