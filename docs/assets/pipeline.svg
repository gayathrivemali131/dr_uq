<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 175" width="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f4c5c"/></marker></defs><rect x="10" y="30" width="112" height="78" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="18" y="47" font-size="11" font-weight="700" fill="#0f4c5c">fundus image</text><text x="18" y="63" font-size="8.6" fill="#1d2a2e">raw camera</text><text x="18" y="75" font-size="8.6" fill="#1d2a2e">output</text><line x1="122" y1="69" x2="136" y2="69" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><rect x="136" y="30" width="112" height="78" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="144" y="47" font-size="11" font-weight="700" fill="#0f4c5c">preprocess</text><text x="144" y="63" font-size="8.6" fill="#1d2a2e">FOV crop</text><text x="144" y="75" font-size="8.6" fill="#1d2a2e">Graham σ=10</text><text x="144" y="87" font-size="8.6" fill="#1d2a2e">512² · q(x)</text><line x1="248" y1="69" x2="262" y2="69" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><rect x="262" y="30" width="112" height="78" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="270" y="47" font-size="11" font-weight="700" fill="#0f4c5c">grader f</text><text x="270" y="63" font-size="8.6" fill="#1d2a2e">backbone</text><text x="270" y="75" font-size="8.6" fill="#1d2a2e">dropout · head</text><text x="270" y="87" font-size="8.6" fill="#1d2a2e">logits z</text><line x1="374" y1="69" x2="388" y2="69" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><rect x="388" y="30" width="112" height="78" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="396" y="47" font-size="11" font-weight="700" fill="#0f4c5c">UQ wrapper</text><text x="396" y="63" font-size="8.6" fill="#1d2a2e">p = softmax(z/T)</text><text x="396" y="75" font-size="8.6" fill="#1d2a2e">or MC / ensemble</text><text x="396" y="87" font-size="8.6" fill="#1d2a2e">u = score(p)</text><line x1="500" y1="69" x2="514" y2="69" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><rect x="514" y="30" width="112" height="78" rx="5" fill="#fdf1e7" stroke="#e36414" stroke-width="1.3"/><text x="522" y="47" font-size="11" font-weight="700" fill="#e36414">selective gate</text><text x="522" y="63" font-size="8.6" fill="#1d2a2e">u &lt; τ ?</text><text x="522" y="75" font-size="8.6" fill="#1d2a2e">yes → grade</text><text x="522" y="87" font-size="8.6" fill="#1d2a2e">no → REFER</text><line x1="626" y1="69" x2="640" y2="69" stroke="#0f4c5c" stroke-width="1.4" marker-end="url(#ah)"/><rect x="640" y="30" width="112" height="78" rx="5" fill="#eef4f5" stroke="#0f4c5c" stroke-width="1.3"/><text x="648" y="47" font-size="11" font-weight="700" fill="#0f4c5c">explanation</text><text x="648" y="63" font-size="8.6" fill="#1d2a2e">if requested:</text><text x="648" y="75" font-size="8.6" fill="#1d2a2e">x′ = G(w′), Δ</text><text x="648" y="87" font-size="8.6" fill="#1d2a2e">Grad-CAM</text><text x="10" y="140" font-size="9" fill="#5b6b70">Output JSON: {grade ∈ 0..4 | −1, confidence = max p, uncertainty u, refer, latency_ms, quality_score}.  Thresholds τ are chosen on the validation split for a target coverage (e.g. 80 %) and frozen.</text><text x="10" y="158" font-size="9" fill="#5b6b70">Explanation branch: invert x → w, then optimise w′ toward the adjacent grade g′ under the frozen, temperature-scaled grader; Δ = |x′ − x| is validated against lesion masks.</text></svg>