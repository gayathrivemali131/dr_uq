[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dr_uq"
version = "0.1.0"
description = "Uncertainty-calibrated diabetic retinopathy grading with counterfactual visual explanations (research prototype, not a medical device)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
  "torch~=2.14",
  "torchvision~=0.29.0",
  "timm~=1.0",
  "lightning~=2.6",
  "torchmetrics~=1.9",
  "hydra-core~=1.3",
  "omegaconf~=2.3",
  "albumentations~=2.0",
  "opencv-python-headless~=5.0",
  "numpy~=2.4",
  "pandas~=3.0",
  "scipy~=1.17",
  "scikit-learn~=1.9",
  "matplotlib~=3.11",
  "pillow~=12.3",
  "pyyaml~=6.0",
  "tqdm~=4.70",
  "wandb~=0.30.0",
  "onnx~=1.22",
  "onnxruntime~=1.30",
  "onnxscript~=0.7.2",
  "lpips~=0.1.4",
  "captum~=0.9.0",
  "pytorch-fid~=0.3.0",
  "pyarrow~=25.0",
]

[project.optional-dependencies]
dev = [
  "pytest~=9.1",
  "pytest-cov~=7.1",
  "ruff~=0.16.8",
  "black~=26.5",
  "mypy~=2.3",
  "pre-commit~=4.6",
  "netcal~=1.4",
  "types-PyYAML~=6.0",
  "pandas-stubs~=3.0",
  "python-pptx~=1.0",
]
trt = ["tensorrt~=11.3", "pycuda~=2026.1"]

[project.scripts]
dr-uq = "dr_uq.deploy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dr_uq"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B"]
ignore = ["E501", "B905", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["dr_uq"]

[tool.mypy]
python_version = "3.11"
files = ["dr_uq"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_optional = true
check_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = ["dr_uq.deploy.build_trt"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
